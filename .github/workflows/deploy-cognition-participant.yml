name: Deploy Cognition participant study

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cognition-participant-study
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check Cognition token
        env:
          COGNITION_TOKEN: ${{ secrets.COGNITION_PERSONAL_ACCESS_TOKEN }}
        run: |
          if [ -z "$COGNITION_TOKEN" ]; then
            echo "Add the Cognition account token as the COGNITION_PERSONAL_ACCESS_TOKEN repository secret."
            exit 1
          fi
      - name: Check out only the import package
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: cognition-participant
          persist-credentials: false
      - name: Import the full study into Cognition
        id: deploy
        uses: javidalpe/cognition-deploy-action@e8a7622c521a02a5c8b8881d8ba96557ed916f5d # v1.2.0
        with:
          personal-access-token: ${{ secrets.COGNITION_PERSONAL_ACCESS_TOKEN }}
          jspsych-version: '8.2.3'
      - name: Show the participant study link
        env:
          COGNITION_LINK: ${{ steps.deploy.outputs.link }}
        run: |
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit, urlunsplit, parse_qsl, urlencode
          url = urlsplit(os.environ['COGNITION_LINK'])
          if url.scheme != 'https' or not (url.hostname or '').endswith('.cognition.run'):
              raise SystemExit('Cognition did not return a valid task URL. Check the import log.')
          link = urlunsplit((url.scheme, url.netloc, url.path, '', ''))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Participant study\n\n')
              summary.write(f'[Open the study]({link})\n\n')
              summary.write('This deploys the W01 participant package with 42 server-assigned conditions. ')
              summary.write('In Prolific, use URL parameters for PROLIFIC_PID, STUDY_ID and SESSION_ID. ')
              summary.write('Do not add a condition override. Complete consent and return-link settings ')
              summary.write('and verify a full saved run before recruitment.\n')
          PY
